<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa XYZ — OpenLayers</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>

  <style>
    /* ── reset & tokens ───────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0e14;
      --panel:     #12161f;
      --border:    #1e2535;
      --accent:    #3af0a2;
      --accent2:   #0ff;
      --text:      #c8d6e8;
      --text-dim:  #4a5a72;
      --radius:    10px;
      --font-ui:   'Courier New', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
    }

    /* ── layout ───────────────────────────────────── */
    #app {
      display: grid;
      grid-template-rows: 52px 1fr 36px;
      height: 100vh;
      overflow: hidden;
    }

    /* ── header ───────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
    }

    .logo svg { flex-shrink: 0; }

    header h1 {
      font-size: 11px;
      font-weight: normal;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-left: 1px solid var(--border);
      padding-left: 14px;
    }

    /* coordinate display */
    #coords {
      margin-left: auto;
      font-size: 11px;
      color: var(--accent2);
      letter-spacing: .06em;
      min-width: 230px;
      text-align: right;
      opacity: .85;
      transition: opacity .2s;
    }

    /* ── map container ────────────────────────────── */
    #map {
      width: 100%;
      height: 100%;
      position: relative;
      background: #080b11;
    }

    /* crosshair overlay */
    #map::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, transparent calc(50% - .5px), rgba(58,240,162,.18) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
        linear-gradient(to bottom, transparent calc(50% - .5px), rgba(58,240,162,.18) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px));
      z-index: 2;
    }

    /* ── status bar ───────────────────────────────── */
    footer {
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 24px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--text-dim);
      text-transform: uppercase;
      z-index: 10;
    }

    #zoom-level { color: var(--accent); }
    #tile-source { color: var(--text-dim); }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── OpenLayers overrides ─────────────────────── */
    .ol-attribution,
    .ol-attribution ul {
      background: rgba(11,14,20,.82) !important;
      color: var(--text-dim) !important;
      font-family: var(--font-ui) !important;
      font-size: 10px !important;
      border-radius: 4px !important;
      border: 1px solid var(--border) !important;
    }

    .ol-attribution a { color: var(--accent2) !important; }

    .ol-zoom {
      top: 14px !important;
      left: 14px !important;
    }

    .ol-zoom button {
      background: var(--panel) !important;
      color: var(--accent) !important;
      border: 1px solid var(--border) !important;
      font-size: 18px !important;
      width: 32px !important;
      height: 32px !important;
      border-radius: var(--radius) !important;
      transition: background .15s, color .15s !important;
    }

    .ol-zoom button:hover {
      background: var(--accent) !important;
      color: var(--bg) !important;
    }

    .ol-rotate { display: none; }

    /* loading indicator */
    #loading {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 20;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
      display: none;
      align-items: center;
      gap: 8px;
    }

    #loading.visible { display: flex; }

    .spinner {
      width: 10px; height: 10px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* scale line */
    .ol-scale-line {
      background: rgba(11,14,20,.82) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      bottom: 44px !important;
      left: 14px !important;
      padding: 4px 8px !important;
    }

    .ol-scale-line-inner {
      border-color: var(--accent) !important;
      color: var(--accent) !important;
      font-family: var(--font-ui) !important;
      font-size: 10px !important;
      letter-spacing: .08em !important;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <!-- grid icon -->
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="7" height="7" stroke="currentColor" stroke-width="1.4"/>
        <rect x="12" y="1" width="7" height="7" stroke="currentColor" stroke-width="1.4"/>
        <rect x="1" y="12" width="7" height="7" stroke="currentColor" stroke-width="1.4"/>
        <rect x="12" y="12" width="7" height="7" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      XYZ Tiles
    </div>
    <h1>OpenLayers Viewer</h1>
    <div id="coords">—</div>
  </header>

  <!-- Map -->
  <div id="map">
    <div id="loading"><span class="spinner"></span>Carregando tiles…</div>
  </div>

  <!-- Status bar -->
  <footer>
    <div class="dot"></div>
    <span>Zoom: <span id="zoom-level">—</span></span>
    <span id="tile-source">fonte: ./tiles/{z}/{x}/{y}.png</span>
  </footer>

</div>

<script src="main.js"></script>
</body>
</html>
